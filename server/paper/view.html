<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Stop Press</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; overflow: hidden; }
  img { position: absolute; display: block; }
</style>
</head>
<body>
<img id="page" alt="">
<script>
// The paper in any web browser: e-readers' built-in browsers (Kindle "Experimental Browser", Kobo, Boox), old
// phones and tablets. The server draws every screen; this page only shows it and sends taps and keys.
// Plain ES5 on purpose: e-reader browsers are old WebKit.
var TOKEN = "__TOKEN__";
var img = document.getElementById("page");
var lastTouch = new Date().getTime();
var scale = 1;

function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  scale = Math.min(w / 600, h / 800);
  img.style.width = Math.round(600 * scale) + "px";
  img.style.height = Math.round(800 * scale) + "px";
  img.style.left = Math.round((w - 600 * scale) / 2) + "px";
  img.style.top = Math.round((h - 800 * scale) / 2) + "px";
}

function go(query) {
  img.src = "ui.png?t=" + encodeURIComponent(TOKEN) + "&" + query + "&_=" + new Date().getTime();
}

function press(query) {
  lastTouch = new Date().getTime();
  go(query);
}

document.onclick = function (e) {
  var r = img.getBoundingClientRect();
  var x = Math.round((e.clientX - r.left) / scale), y = Math.round((e.clientY - r.top) / scale);
  if (x < 0 || y < 0 || x > 600 || y > 800) return;
  press("k=tap&x=" + x + "&y=" + y);
};

// Keyboards, page-turn buttons that send arrow or page keys, and desktop browsers.
var KEYS = { 33: "prev", 34: "next", 37: "left", 38: "up", 39: "right", 40: "down", 13: "select", 32: "next",
             8: "back", 27: "back", 36: "home", 77: "menu" };
document.onkeydown = function (e) {
  var k = KEYS[e.keyCode];
  if (!k) return true;
  press("k=" + k);
  return false;
};

// Left alone for 15 minutes, go back to the front page, fresh. E-ink only redraws when something changes.
setInterval(function () {
  if (new Date().getTime() - lastTouch > 15 * 60 * 1000) go("k=auto");
}, 15 * 60 * 1000);

window.onresize = fit;
fit();
go("k=none");
</script>
</body>
</html>
